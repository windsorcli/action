name: Bootstrap or destroy environment
# Copy into your own repo's .github/workflows/ and adjust the contexts and
# blueprint. Manually triggered: bootstrap stands up all four clouds below,
# destroy tears them down. Assumes contexts/<context>/ already exists and
# declares its platform (e.g. from a prior local `windsor init <context>
# --platform <platform>`).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options: [bootstrap, destroy]
        required: true

permissions:
  contents: read
  id-token: write # needed for aws/azure/gcp OIDC login

jobs:
  bootstrap:
    if: inputs.action == 'bootstrap'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: aws
            platform: aws
            aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
            aws_region: ${{ vars.AWS_REGION }}
          - context: azure
            platform: azure
            azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
            azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          - context: gcp
            platform: gcp
            gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          - context: hetzner
            platform: hetzner
            hetzner_token: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windsor CLI
        uses: windsorcli/action@v1
        with:
          ref: v1.0.0
          context: ${{ matrix.context }}

      # Hetzner has no OIDC, so cloud-auth doesn't handle it.
      - name: Authenticate to cloud
        if: matrix.platform != 'hetzner'
        uses: windsorcli/action/cloud-auth@v1
        with:
          platform: ${{ matrix.platform }}
          aws-role-arn: ${{ matrix.aws_role_arn }}
          aws-region: ${{ matrix.aws_region }}
          azure-client-id: ${{ matrix.azure_client_id }}
          azure-tenant-id: ${{ matrix.azure_tenant_id }}
          azure-subscription-id: ${{ matrix.azure_subscription_id }}
          gcp-workload-identity-provider: ${{ matrix.gcp_workload_identity_provider }}
          gcp-service-account: ${{ matrix.gcp_service_account }}

      - name: Configure Hetzner credentials
        if: matrix.platform == 'hetzner'
        run: echo "HCLOUD_TOKEN=${{ matrix.hetzner_token }}" >> "$GITHUB_ENV"

      - name: Bootstrap environment
        uses: windsorcli/action/bootstrap@v1
        with:
          context: ${{ matrix.context }}
          platform: ${{ matrix.platform }}
          blueprint: oci://ghcr.io/myorg/blueprint:v1.0.0
          yes: true

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: aws
            platform: aws
            aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
            aws_region: ${{ vars.AWS_REGION }}
            aws_cluster_name: ${{ vars.AWS_CLUSTER_NAME }}
          - context: azure
            platform: azure
            azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
            azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
            azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
            azure_cluster_name: ${{ vars.AZURE_CLUSTER_NAME }}
          - context: gcp
            platform: gcp
            gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
            gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
            gcp_cluster_name: ${{ vars.GCP_CLUSTER_NAME }}
            gcp_region: ${{ vars.GCP_REGION }}
          - context: hetzner
            platform: hetzner
            hetzner_token: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windsor CLI
        uses: windsorcli/action@v1
        with:
          ref: v1.0.0
          context: ${{ matrix.context }}

      # Hetzner has no OIDC, so cloud-auth doesn't handle it.
      - name: Authenticate to cloud
        if: matrix.platform != 'hetzner'
        uses: windsorcli/action/cloud-auth@v1
        with:
          platform: ${{ matrix.platform }}
          aws-role-arn: ${{ matrix.aws_role_arn }}
          aws-region: ${{ matrix.aws_region }}
          azure-client-id: ${{ matrix.azure_client_id }}
          azure-tenant-id: ${{ matrix.azure_tenant_id }}
          azure-subscription-id: ${{ matrix.azure_subscription_id }}
          gcp-workload-identity-provider: ${{ matrix.gcp_workload_identity_provider }}
          gcp-service-account: ${{ matrix.gcp_service_account }}

      - name: Configure Hetzner credentials
        if: matrix.platform == 'hetzner'
        run: echo "HCLOUD_TOKEN=${{ matrix.hetzner_token }}" >> "$GITHUB_ENV"

      # This job never ran bootstrap's apply, so there's no local kubeconfig yet.
      - name: Regenerate kubeconfig
        uses: windsorcli/action/kubeconfig@v1
        with:
          platform: ${{ matrix.platform }}
          aws-cluster-name: ${{ matrix.aws_cluster_name }}
          aws-region: ${{ matrix.aws_region }}
          azure-resource-group: ${{ matrix.azure_resource_group }}
          azure-cluster-name: ${{ matrix.azure_cluster_name }}
          gcp-cluster-name: ${{ matrix.gcp_cluster_name }}
          gcp-region: ${{ matrix.gcp_region }}
          gcp-project-id: ${{ matrix.gcp_project_id }}

      # windsor destroy has no context argument — it acts on whatever
      # context windsor init already set.
      - name: Destroy environment
        uses: windsorcli/action/destroy@v1
        with:
          confirm: ${{ matrix.context }}
