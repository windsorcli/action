# Fixture for testing convert_kubelogin_mode (scripts/lib.sh) in CI. Shaped
# like what `az aks get-credentials` writes before conversion: a user with an
# Azure auth-provider stanza. All identifiers here are fake — this file is
# never used against a real cluster.
apiVersion: v1
kind: Config
clusters:
- name: test-cluster
  cluster:
    server: https://test-cluster.example.com
    certificate-authority-data: dGVzdA==
contexts:
- name: test-cluster
  context:
    cluster: test-cluster
    user: clusterUser_test-rg_test-cluster
current-context: test-cluster
users:
- name: clusterUser_test-rg_test-cluster
  user:
    auth-provider:
      name: azure
      config:
        apiserver-id: 6dae42f8-4368-4678-94ff-3960e28e3630
        client-id: 80faf920-1908-4b52-b5ef-a8e7913483e2
        environment: AzurePublicCloud
        tenant-id: 00000000-0000-0000-0000-000000000000
