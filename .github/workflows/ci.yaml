name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'  # Run at 2AM ET / 6AM UTC

jobs:
  test:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    env:
      WINDSOR_CONTEXT: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ref:
          - v0.9.0 # renovate: datasource=github-releases depName=windsorcli/cli
          - nightly
          - main
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: ${{ matrix.ref == 'main' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1 # renovate: datasource=github-releases depName=golang/go

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4 # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_wrapper: false

      - name: Install Windsor CLI
        uses: ./
        with:
          workdir: test
          ref: ${{ matrix.ref }}
          context: ${{ env.WINDSOR_CONTEXT }}

      - name: Verify Windsor Context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');
            const path = require('path');

            try {
              console.log('Getting Windsor context...');
              const contextOutput = execSync(`windsor get-context`, { stdio: 'pipe' }).toString().trim();
              console.log(`Current Windsor context: ${contextOutput}`);
              const expectedContext = process.env.WINDSOR_CONTEXT;
              if (contextOutput !== expectedContext) {
                console.error(`Error: Windsor context is not '${expectedContext}'. Current context: ${contextOutput}`);
                process.exit(1);
              } else {
                console.log(`Windsor context is correctly set to ${expectedContext}.`);
              }
            } catch (error) {
              console.error('Error getting Windsor context:', error);
              process.exit(1);
            }

      - name: Assert base environment variables are injected
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const requiredEnvVars = [
              'KUBECONFIG',
              'KUBE_CONFIG_PATH',
              'TALOSCONFIG',
              'WINDSOR_CONTEXT',
              'WINDSOR_PROJECT_ROOT',
            ];

            const missingVars = requiredEnvVars.filter(varName => !process.env[varName]);
            if (missingVars.length > 0) {
              console.error('Missing required environment variables:', missingVars);
              process.exit(1);
            }

            console.log('All required environment variables are present:');
            requiredEnvVars.forEach(varName => {
              console.log(`${varName}=${process.env[varName]}`);
            });

      - name: Change to a terraform folder
        uses: ./
        with:
          workdir: test/terraform/sample
          ref: ${{ matrix.ref }}
          context: ${{ env.WINDSOR_CONTEXT }}

      - name: Assert TF_ environment variables are injected
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const requiredTfVars = [
              'TF_CLI_ARGS_apply',
              'TF_CLI_ARGS_destroy',
              'TF_CLI_ARGS_import',
              'TF_CLI_ARGS_init',
              'TF_CLI_ARGS_plan',
              'TF_DATA_DIR',
              'TF_VAR_context_path',
              'TF_VAR_os_type'
            ];
            const missingVars = requiredTfVars.filter(varName => !process.env[varName]);
            if (missingVars.length > 0) {
              console.error('Missing required TF_ environment variables:', missingVars);
              process.exit(1);
            }

            const projectRoot = process.env.WINDSOR_PROJECT_ROOT.replace(/\\/g, '/');
            const ref = '${{ matrix.ref }}';

            // Compares a `vX.Y.Z` tag against a minimum version. Returns false for
            // main, nightly, and other non-semver refs; callers check those separately.
            const isAtLeastVersion = (candidate, minimum) => {
              const parse = (v) => v.replace(/^v/i, '').split('.').map(Number);
              const [cMajor, cMinor, cPatch] = parse(candidate);
              const [mMajor, mMinor, mPatch] = parse(minimum);
              if (Number.isNaN(cMajor)) return false;
              if (cMajor !== mMajor) return cMajor > mMajor;
              if (cMinor !== mMinor) return cMinor > mMinor;
              return cPatch >= mPatch;
            };
            // main and nightly always track the latest CLI behavior. v0.9.0+
            // release tags carry the same behavior going forward.
            const isPostV090 = ref === 'main' || ref === 'nightly' || isAtLeastVersion(ref, 'v0.9.0');

            // Terraform data directories are under .windsor/contexts in v0.8.1+
            const terraformBasePath = `${projectRoot}/.windsor/contexts/test/.terraform/sample`;
            const tfstateBasePath = `${projectRoot}/.windsor/contexts/test/.tfstate/sample/terraform.tfstate`;
            const tfvarsPath = `${projectRoot}/contexts/test/terraform/sample.tfvars`;
            const contextPath = `${projectRoot}/contexts/test`;

            // v0.9.0+ appends `-lock-timeout=5m` to every TF_CLI_ARGS_* and drops
            // `-force-copy -upgrade` from init. Earlier versions have neither change.
            const lockTimeout = isPostV090 ? ' -lock-timeout=5m' : '';
            const tfInitArgs = isPostV090
              ? `-backend=true -backend-config="path=${tfstateBasePath}"${lockTimeout}`
              : `-backend=true -force-copy -upgrade -backend-config="path=${tfstateBasePath}"`;
            const applyPlanPath = isPostV090
              ? `-lock-timeout=5m "${terraformBasePath}/terraform.tfplan"`
              : `"${terraformBasePath}/terraform.tfplan"`;
            const destroyArgs = `-var-file="${tfvarsPath}"${lockTimeout}`;
            const importArgs = `-var-file="${tfvarsPath}"${lockTimeout}`;
            const planArgs = `-out="${terraformBasePath}/terraform.tfplan" -var-file="${tfvarsPath}"${lockTimeout}`;

            let expectedVars;
            if (process.platform === 'win32') {
              expectedVars = {
                'TF_CLI_ARGS_apply': applyPlanPath,
                'TF_CLI_ARGS_destroy': destroyArgs,
                'TF_CLI_ARGS_import': importArgs,
                'TF_CLI_ARGS_init': tfInitArgs,
                'TF_CLI_ARGS_plan': planArgs,
                'TF_DATA_DIR': terraformBasePath,
                'TF_VAR_context_path': contextPath,
                'TF_VAR_os_type': 'windows'
              };
            } else {
              expectedVars = {
                'TF_CLI_ARGS_apply': applyPlanPath,
                'TF_CLI_ARGS_destroy': destroyArgs,
                'TF_CLI_ARGS_import': importArgs,
                'TF_CLI_ARGS_init': tfInitArgs,
                'TF_CLI_ARGS_plan': planArgs,
                'TF_DATA_DIR': terraformBasePath,
                'TF_VAR_context_path': contextPath,
                'TF_VAR_os_type': 'unix'
              };
            }

            for (const [varName, expectedValue] of Object.entries(expectedVars)) {
              if (process.env[varName] !== expectedValue) {
                console.error(`Error: ${varName} does not match expected value`);
                console.error(`Expected: ${expectedValue}`);
                console.error(`Got: ${process.env[varName]}`);
                process.exit(1);
              }
            }

            console.log('All required TF_ environment variables are present and correct:');
            requiredTfVars.forEach(varName => {
              console.log(`${varName}=${process.env[varName]}`);
            });

      - name: Assert Terraform workflow creates expected output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            try {
              process.chdir('test/terraform/sample');
              execSync('terraform init', { stdio: 'inherit' });
              execSync('terraform plan', { stdio: 'inherit' });
              execSync('terraform apply', { stdio: 'inherit' });

              if (!fs.existsSync('test.txt')) {
                console.error('Error: test.txt was not created');
                process.exit(1);
              }

              const content = fs.readFileSync('test.txt', 'utf8');
              if (content !== 'Hello from Windsor CLI test!') {
                console.error(`Error: test.txt contents do not match expected value. Expected: "Hello from Windsor CLI test!", Got: "${content}"`);
                process.exit(1);
              }

              console.log('✓ Terraform workflow completed successfully');
            } catch (error) {
              console.error('Error running Terraform:', error.message);
              if (error.stdout) console.error('stdout:', error.stdout);
              if (error.stderr) console.error('stderr:', error.stderr);
              process.exit(1);
            }

      - name: Test secret masking
        uses: ./
        with:
          context: test
          workdir: test
          ref: ${{ matrix.ref }}
          inject-secrets: true

      - name: Verify secret masking
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const vars = [
              'TEST_SENSITIVE',
              'TEST_SENSITIVE_ALT',
              'TEST_SENSITIVE_SPACED',
              'TEST_SENSITIVE_NESTED',
              'TEST_SENSITIVE_MULTI',
              'TEST_SENSITIVE_EMPTY',
              'TEST_SENSITIVE_INVALID',
            ];
            console.log('Printing secret environment variables for manual masking verification:');
            for (const v of vars) {
              console.log(`${v}='${process.env[v]}'`);
            }

  test-install-only:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ref:
          - v0.9.0 # renovate: datasource=github-releases depName=windsorcli/cli
          - nightly
          - main
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1 # renovate: datasource=github-releases depName=golang/go

      - name: Install Windsor CLI (install-only)
        uses: ./
        with:
          ref: ${{ matrix.ref }}
          install-only: true

      - name: Verify CLI is installed but not initialized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            try {
              // Verify CLI is installed and executable
              const versionOutput = execSync('windsor version', { stdio: 'pipe' }).toString().trim();
              console.log('Windsor CLI version:', versionOutput);

              // Verify environment variables are not set
              const requiredEnvVars = [
                'KUBECONFIG',
                'KUBE_CONFIG_PATH',
                'OMNICONFIG',
                'TALOSCONFIG',
                'WINDSOR_CONTEXT',
                'WINDSOR_PROJECT_ROOT'
              ];

              const setVars = requiredEnvVars.filter(varName => process.env[varName]);
              if (setVars.length > 0) {
                console.error('Error: Environment variables should not be set in install-only mode:', setVars);
                process.exit(1);
              }

              // Verify windsor.yaml was not created
              if (fs.existsSync('windsor.yaml')) {
                console.error('Error: windsor.yaml was created in install-only mode');
                process.exit(1);
              }

              console.log('✓ No environment variables are set as expected');
              console.log('✓ windsor.yaml was not created as expected');
            } catch (error) {
              console.error('Error:', error.message);
              process.exit(1);
            }

  test-sub-actions:
    # Exercises the lifecycle sub-actions (up/apply/destroy/bootstrap/check) against a
    # stub `windsor` binary instead of the real CLI: these actions only build an argument
    # list and hand it to `windsor`, so a stub that records its invocation is enough to
    # verify the argument construction and validation logic without cloud/cluster infra.
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck scripts/lib.sh
        # Runs once rather than per OS — it's a static lint of one file, not
        # platform-dependent behavior. ubuntu-latest ships shellcheck preinstalled.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: shellcheck scripts/lib.sh

      - name: windsor check (no CLI on PATH)
        id: check-no-cli
        uses: ./check
        continue-on-error: true

      - name: Assert check-no-cli failed
        shell: bash
        run: |
          if [ "${{ steps.check-no-cli.outcome }}" != "failure" ]; then
            echo "::error::expected windsor check to fail with no windsor CLI on PATH, got outcome '${{ steps.check-no-cli.outcome }}'"
            exit 1
          fi

      - name: Install stub windsor CLI
        shell: bash
        run: |
          stub_dir="$RUNNER_TEMP/windsor-stub"
          mkdir -p "$stub_dir"
          stub_log="$RUNNER_TEMP/windsor-calls.log"
          : > "$stub_log"
          # Built with individual `echo` lines rather than a heredoc so the file's
          # content isn't at the mercy of this step's own YAML indentation (a
          # heredoc would bake that indentation into the shebang line and break it).
          stub="$stub_dir/windsor"
          {
            echo '#!/usr/bin/env bash'
            echo '# Records every invocation (other than `get context`, an implementation'
            echo '# detail of emit_context_output) so tests can assert on the exact'
            echo '# argument list a sub-action built, without a real windsor CLI.'
            echo 'if [ "$1" = "get" ] && [ "$2" = "context" ]; then'
            echo '  echo "stub-context"'
            echo '  exit 0'
            echo 'fi'
            echo 'if [ "$1" = "get" ] && [ "$2" = "contexts" ]; then'
            echo '  printf "NAME          PROVIDER  BACKEND  CURRENT\n"'
            echo '  printf "stub-context  %s  <none>   *\n" "${WINDSOR_STUB_PLATFORM:-docker}"'
            echo '  exit 0'
            echo 'fi'
            echo 'echo "$*" >> "$WINDSOR_STUB_LOG"'
            echo 'if [ "$1" = "plan" ]; then'
            echo '  echo "Terraform"'
            echo '  echo "  cluster   ~ update"'
            echo '  if [ "$FAIL_PLAN" = "true" ]; then'
            echo '    echo "Error: something went wrong (stub)"'
            echo '    exit 1'
            echo '  fi'
            echo '  exit 0'
            echo 'fi'
            echo 'exit 0'
          } > "$stub"
          chmod +x "$stub"
          echo "$stub_dir" >> "$GITHUB_PATH"
          echo "WINDSOR_STUB_LOG=$stub_log" >> "$GITHUB_ENV"

      - name: windsor up
        id: up-call
        uses: ./up
        with:
          wait: true
          platform: aws
          set: |
            a=1
            b=2

      - name: Assert up invocation and output
        shell: bash
        run: |
          grep -qxF "up --wait --platform aws --set a=1 --set b=2" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected windsor up invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }
          if [ "${{ steps.up-call.outputs.context }}" != "stub-context" ]; then
            echo "::error::expected context output 'stub-context', got '${{ steps.up-call.outputs.context }}'"
            exit 1
          fi

      - name: windsor apply (unscoped)
        uses: ./apply
        with:
          wait: true
          prune: true

      - name: windsor apply (terraform-scoped)
        uses: ./apply
        with:
          terraform-component: cluster

      - name: windsor apply (kustomize-scoped)
        uses: ./apply
        with:
          kustomize-name: dns
          wait: true

      - name: Assert apply invocations
        shell: bash
        run: |
          grep -qxF "apply --wait --prune" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected unscoped windsor apply invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }
          grep -qxF "apply terraform cluster" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected terraform-scoped windsor apply invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }
          grep -qxF "apply kustomize dns --wait" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected kustomize-scoped windsor apply invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }

      - name: windsor apply (conflicting scope)
        id: apply-conflict
        uses: ./apply
        with:
          terraform-component: cluster
          kustomize-name: dns
        continue-on-error: true

      - name: windsor apply (wait with terraform-component)
        id: apply-bad-wait
        uses: ./apply
        with:
          terraform-component: cluster
          wait: true
        continue-on-error: true

      - name: windsor apply (prune with kustomize-name)
        id: apply-bad-prune
        uses: ./apply
        with:
          kustomize-name: dns
          prune: true
        continue-on-error: true

      - name: Assert apply validation failures
        shell: bash
        run: |
          if [ "${{ steps.apply-conflict.outcome }}" != "failure" ]; then
            echo "::error::expected apply with both terraform-component and kustomize-name to fail"
            exit 1
          fi
          if [ "${{ steps.apply-bad-wait.outcome }}" != "failure" ]; then
            echo "::error::expected apply --wait with terraform-component to fail"
            exit 1
          fi
          if [ "${{ steps.apply-bad-prune.outcome }}" != "failure" ]; then
            echo "::error::expected apply --prune with kustomize-name to fail"
            exit 1
          fi

      - name: windsor destroy
        uses: ./destroy
        with:
          confirm: my-context
          component: cluster
          layer: terraform
          continue: true

      - name: Assert destroy invocation
        shell: bash
        run: |
          grep -qxF "destroy terraform cluster --confirm my-context --continue" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected windsor destroy invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }

      - name: windsor destroy (missing confirm)
        id: destroy-no-confirm
        uses: ./destroy
        with:
          confirm: ""
        continue-on-error: true

      - name: Assert destroy-no-confirm failed
        shell: bash
        run: |
          if [ "${{ steps.destroy-no-confirm.outcome }}" != "failure" ]; then
            echo "::error::expected windsor destroy with no confirm to fail"
            exit 1
          fi

      - name: windsor destroy (invalid layer)
        id: destroy-bad-layer
        uses: ./destroy
        with:
          confirm: my-context
          layer: bogus
        continue-on-error: true

      - name: Assert destroy-bad-layer failed
        shell: bash
        run: |
          if [ "${{ steps.destroy-bad-layer.outcome }}" != "failure" ]; then
            echo "::error::expected windsor destroy with an invalid layer to fail"
            exit 1
          fi

      - name: windsor bootstrap
        uses: ./bootstrap
        with:
          context: staging
          yes: true
          platform: gcp

      - name: Assert bootstrap invocation
        shell: bash
        run: |
          grep -qxF "bootstrap staging --yes --platform gcp" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected windsor bootstrap invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }

      - name: windsor bootstrap (missing yes)
        id: bootstrap-no-yes
        uses: ./bootstrap
        with:
          yes: ""
        continue-on-error: true

      - name: Assert bootstrap-no-yes failed
        shell: bash
        run: |
          if [ "${{ steps.bootstrap-no-yes.outcome }}" != "failure" ]; then
            echo "::error::expected windsor bootstrap with no yes to fail"
            exit 1
          fi

      - name: windsor check
        id: check-call
        uses: ./check

      - name: Assert check invocation and output
        shell: bash
        run: |
          grep -qxF "check" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected windsor check invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }
          if [ "${{ steps.check-call.outputs.context }}" != "stub-context" ]; then
            echo "::error::expected context output 'stub-context', got '${{ steps.check-call.outputs.context }}'"
            exit 1
          fi

      # plan-comment isn't invoked via `uses: ./plan-comment` like the other sub-actions:
      # its middle step is a real actions/github-script call that would post to the actual
      # GitHub API (and this workflow's real PR) if run wholesale. Its three steps are
      # extracted and tested individually instead — runs once on ubuntu-latest since none
      # of this is OS-dependent.
      - name: Install PyYAML (for extracting composite action scripts to test)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: python3 -m pip install --quiet pyyaml

      - name: windsor plan (via plan-comment's first step)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/test/extract-step.py plan-comment/action.yaml 0 > "$RUNNER_TEMP/plan-comment-step0.sh"

          GITHUB_OUTPUT="$RUNNER_TEMP/plan-comment-outputs-1.txt" INPUT_WORKDIR="" INPUT_COMPONENT="" \
            bash "$RUNNER_TEMP/plan-comment-step0.sh"
          grep -qxF "plan --summary --no-color" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected unscoped windsor plan invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }
          grep -qxF "plan-status=ok" "$RUNNER_TEMP/plan-comment-outputs-1.txt" || {
            echo "::error::expected plan-status=ok"; cat "$RUNNER_TEMP/plan-comment-outputs-1.txt"; exit 1;
          }

          GITHUB_OUTPUT="$RUNNER_TEMP/plan-comment-outputs-2.txt" INPUT_WORKDIR="" INPUT_COMPONENT="cluster" \
            bash "$RUNNER_TEMP/plan-comment-step0.sh"
          grep -qxF "plan cluster --summary --no-color" "$WINDSOR_STUB_LOG" || {
            echo "::error::expected component-scoped windsor plan invocation not found"; cat "$WINDSOR_STUB_LOG"; exit 1;
          }

          GITHUB_OUTPUT="$RUNNER_TEMP/plan-comment-outputs-3.txt" INPUT_WORKDIR="" INPUT_COMPONENT="" FAIL_PLAN=true \
            bash "$RUNNER_TEMP/plan-comment-step0.sh"
          grep -qxF "plan-status=failed" "$RUNNER_TEMP/plan-comment-outputs-3.txt" || {
            echo "::error::expected plan-status=failed when windsor plan itself fails"; cat "$RUNNER_TEMP/plan-comment-outputs-3.txt"; exit 1;
          }

      - name: Test plan-comment JS logic (mocked GitHub API)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/test/extract-step.py plan-comment/action.yaml 1 --wrap-js > "$RUNNER_TEMP/plan-comment-wrapped.js"
          node scripts/test/plan-comment.test.js "$RUNNER_TEMP/plan-comment-wrapped.js"

      - name: Test plan-comment's fail-gate step
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/test/extract-step.py plan-comment/action.yaml 2 > "$RUNNER_TEMP/plan-comment-step2.sh"

          if PLAN_STATUS=ok bash "$RUNNER_TEMP/plan-comment-step2.sh"; then
            :
          else
            echo "::error::expected the fail-gate step to succeed when PLAN_STATUS=ok"; exit 1
          fi

          if PLAN_STATUS=failed bash "$RUNNER_TEMP/plan-comment-step2.sh"; then
            echo "::error::expected the fail-gate step to fail when PLAN_STATUS=failed"; exit 1
          fi

      # cloud-auth's later steps call real aws-actions/configure-aws-credentials,
      # azure/login, etc. — invoking the whole composite for a cloud platform would
      # either need real credentials or fail on a real (if expected) auth error. Its
      # detect/validate step is tested in isolation instead, the same way plan-comment's
      # github-script step is; the full composite is only invoked end-to-end for a
      # no-op platform (docker), which never reaches those steps.
      - name: Test cloud-auth platform detection and validation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/test/extract-step.py cloud-auth/action.yaml 0 > "$RUNNER_TEMP/cloud-auth-detect.sh"

          run_detect() {
            WINDSOR_STUB_PLATFORM="$1" \
            INPUT_WORKDIR="" \
            INPUT_AWS_ROLE_ARN="${2:-}" INPUT_AWS_REGION="${3:-}" \
            INPUT_AZURE_CLIENT_ID="${4:-}" INPUT_AZURE_TENANT_ID="${5:-}" INPUT_AZURE_SUBSCRIPTION_ID="${6:-}" \
            INPUT_GCP_WORKLOAD_IDENTITY_PROVIDER="${7:-}" INPUT_GCP_SERVICE_ACCOUNT="${8:-}" \
            INPUT_HETZNER_TOKEN="${9:-}" \
            GITHUB_OUTPUT="$RUNNER_TEMP/cloud-auth-outputs.txt" \
              bash "$RUNNER_TEMP/cloud-auth-detect.sh"
          }

          : > "$RUNNER_TEMP/cloud-auth-outputs.txt"
          if ! run_detect aws arn:aws:iam::123:role/x us-east-1; then
            echo "::error::expected aws with all inputs to succeed"; exit 1
          fi
          grep -qxF "platform=aws" "$RUNNER_TEMP/cloud-auth-outputs.txt" || {
            echo "::error::expected platform=aws in outputs"; cat "$RUNNER_TEMP/cloud-auth-outputs.txt"; exit 1;
          }

          if run_detect aws arn:aws:iam::123:role/x ""; then
            echo "::error::expected aws with missing aws-region to fail"; exit 1
          fi

          if ! run_detect azure "" "" cid tid sid; then
            echo "::error::expected azure with all inputs to succeed"; exit 1
          fi

          if run_detect gcp "" "" "" "" "" projects/1/providers/x ""; then
            echo "::error::expected gcp with missing gcp-service-account to fail"; exit 1
          fi

          if ! run_detect hetzner "" "" "" "" "" "" "" htz-token; then
            echo "::error::expected hetzner with a token to succeed"; exit 1
          fi

          : > "$RUNNER_TEMP/cloud-auth-outputs.txt"
          if ! run_detect docker; then
            echo "::error::expected docker (no cloud credentials needed) to succeed"; exit 1
          fi
          grep -qxF "platform=docker" "$RUNNER_TEMP/cloud-auth-outputs.txt" || {
            echo "::error::expected platform=docker in outputs"; cat "$RUNNER_TEMP/cloud-auth-outputs.txt"; exit 1;
          }

          if run_detect marsnet; then
            echo "::error::expected an unrecognized platform to fail rather than silently skip"; exit 1
          fi

      - name: cloud-auth (docker, no-op)
        id: cloud-auth-noop
        uses: ./cloud-auth
        env:
          WINDSOR_STUB_PLATFORM: docker

      - name: Assert cloud-auth no-op outputs
        shell: bash
        run: |
          if [ "${{ steps.cloud-auth-noop.outputs.platform }}" != "docker" ]; then
            echo "::error::expected platform output 'docker', got '${{ steps.cloud-auth-noop.outputs.platform }}'"
            exit 1
          fi
          if [ "${{ steps.cloud-auth-noop.outputs.context }}" != "stub-context" ]; then
            echo "::error::expected context output 'stub-context', got '${{ steps.cloud-auth-noop.outputs.context }}'"
            exit 1
          fi
